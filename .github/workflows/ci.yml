name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Lint workflows and action.yml
        run: actionlint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: sentinel doctor
      - run: pytest

  # The oldest dependency versions pyproject.toml allows. Keeps the minimums honest: an older
  # typer (0.12) crashed at startup with current Click, and only this kind of test catches that.
  test-oldest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: >
          pip install "typer==0.13.1" "click==8.1.8" "orjson==3.10.12" "zstandard==0.23.0"
          "pyarrow==18.0.0" "duckdb==1.1.3" "jinja2==3.1.4" "pytest>=8"
      - run: pip install --no-deps -e .
      - run: pytest

  # Build the wheel and sdist exactly as a release would, and check them.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/sentinel analyze tests/fixtures/eventlogs/gallery/skew \
            -w /tmp/wh --profile laptop -f html -o /tmp/report.html
          /tmp/clean/bin/spark-sentinel version
