[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spark-sentinel"
dynamic = ["version"]
description = "Find performance problems in Apache Spark jobs from their event logs."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["spark", "pyspark", "performance", "event-log", "data-engineering"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
# The tool itself never needs Spark or Java: it only reads event-log files.
dependencies = [
    "typer>=0.12",
    "orjson>=3.10",
    "zstandard>=0.23",
    "pyarrow>=16",
    "duckdb>=1.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
# Only for running the PySpark jobs in lab/ that generate event logs.
lab = ["pyspark>=4.0"]

[project.scripts]
sentinel = "spark_sentinel.cli:app"

[tool.hatch.version]
path = "src/spark_sentinel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spark_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, RUF ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/spark_sentinel/rules/*" = ["RUF012"]
"tests/*" = ["RUF012"]
