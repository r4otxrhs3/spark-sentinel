[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spark-sentinel"
dynamic = ["version"]
description = "Find performance problems in Apache Spark jobs from their event logs: skew, spill, small files, bad joins, Python UDFs and more."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Rittika" }]
keywords = [
    "spark", "pyspark", "apache-spark", "performance", "event-log", "data-engineering",
    "linter", "ci",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
# The tool itself never needs Spark or Java: it only reads event-log files.
# Minimum versions are the oldest ones the test suite has been run against.
dependencies = [
    "typer>=0.13.1",
    "orjson>=3.10",
    "zstandard>=0.23",
    "pyarrow>=18",
    "duckdb>=1.1.3",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "build>=1.2", "twine>=6", "pyyaml>=6", "actionlint-py>=1.7"]
# Only for running the PySpark jobs in lab/ that generate event logs.
lab = ["pyspark>=4.0"]

[project.urls]
Homepage = "https://github.com/r4otxrhs3/spark-sentinel"
Repository = "https://github.com/r4otxrhs3/spark-sentinel"
Issues = "https://github.com/r4otxrhs3/spark-sentinel/issues"
Changelog = "https://github.com/r4otxrhs3/spark-sentinel/blob/main/CHANGELOG.md"
Rules = "https://github.com/r4otxrhs3/spark-sentinel/blob/main/docs/rule-catalog.md"

[project.scripts]
sentinel = "spark_sentinel.cli:app"
# Same command under the package's name, so `pipx run spark-sentinel` / `uvx spark-sentinel` work.
spark-sentinel = "spark_sentinel.cli:app"

[tool.hatch.version]
path = "src/spark_sentinel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spark_sentinel"]

[tool.hatch.build.targets.sdist]
# Source distribution: the code, its tests (with their event-log fixtures) and docs.
# Not lab/ (needs Spark to run) or anything generated, except the gallery README: its table
# of which rule fires on which job is what tests/test_matrix.py checks.
include = [
    "/src/spark_sentinel",
    "/tests",
    "/docs",
    "/lab/gallery/README.md",
    "/action",
    "/action.yml",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
]
exclude = ["**/__pycache__", "docs/images"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, RUF ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Rules declare `thresholds = {...}` as a plain class attribute; Rule.__init__ copies it,
# so the shared-mutable-default warning doesn't apply.
"src/spark_sentinel/rules/*" = ["RUF012"]
"tests/*" = ["RUF012"]
